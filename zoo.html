<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球熊猫馆动态 - 熊猫资讯</title>
<meta name="description" content="全球熊猫馆动态：国内场馆与海外场馆索引、馆内熊猫名单、最新动态速递，支持关注与筛选。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐼</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<div class="page-hero">
  <div class="wrap">
    <h1>🏛️ 全球熊猫馆动态</h1>
    <p>国内外场馆索引与最新动态速递。可搜索关键词、筛选国内/海外场馆，关注感兴趣的场馆。</p>
  </div>
</div>

<main class="wrap">
  <div class="search-bar" style="margin-top:22px">
    <input class="input" id="kw" placeholder="搜索场馆名 / 动态关键词，如：福宝、卧龙、生日…" />
    <select class="select" id="regionSel" style="max-width:150px">
      <option value="">全部地区</option>
      <option value="domestic">国内场馆</option>
      <option value="overseas">海外场馆</option>
    </select>
    <button class="btn btn-primary" id="btnSearch">搜索</button>
    <button class="btn btn-ghost" id="btnReset">重置</button>
  </div>

  <div class="filter-tabs" id="regionTabs">
    <button class="filter-tab active" data-region="">全部场馆</button>
    <button class="filter-tab" data-region="domestic">🇨🇳 国内场馆</button>
    <button class="filter-tab" data-region="overseas">🌍 海外场馆</button>
  </div>

  <!-- 场馆卡片 -->
  <div class="grid grid-3" id="venueGrid"></div>

  <!-- 动态内容流 -->
  <section class="section">
    <div class="section-head"><span class="line"></span><h2>最新动态流</h2><span style="font-size:12.5px;color:var(--ink-3)" id="dynCount"></span></div>
    <div id="dynList"></div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<div id="toast"></div>

<script src="js/seed-data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  var DB = PandaDB, U = PandaUI, esc = U.esc, $ = U.$, $$ = U.$$;
  var state = { region: '', kw: '' };

  function venueCard(v) {
    var follows = DB.getFollows();
    var liked = follows.indexOf(v.id) >= 0;
    var pandaNames = (v.pandas || []).join('、') || '暂无大熊猫常驻';
    var pcount = v.pandaCount || (v.pandas ? v.pandas.length + ' 只' : '0');
    return '<div class="card card-pad">' +
      '<div class="card-meta" style="margin-top:0"><span class="tag ' + (v.region === 'domestic' ? 'green' : 'blue') + '">' + (v.region === 'domestic' ? '国内' : '海外') + '</span><span>' + esc(v.location) + '</span></div>' +
      '<div class="card-title" style="margin-top:10px;font-size:17px"><a href="zoo-detail.html?id=' + v.id + '">' + esc(v.name) + '</a></div>' +
      '<div class="stat-line">' +
      '<span>🐼 熊猫数量 <b>' + esc(pcount) + '</b></span>' +
      '<span>更新 <b>' + v.updatedAt + '</b></span>' +
      '</div>' +
      '<div class="card-desc">馆内：' + esc(U.chunk(pandaNames, 30)) + '</div>' +
      '<div style="margin-top:12px;display:flex;gap:8px">' +
      '<a class="btn btn-primary btn-sm" href="zoo-detail.html?id=' + v.id + '">查看专题 →</a>' +
      '<button class="btn btn-sm follow-btn ' + (liked ? 'liked' : 'btn-ghost') + '" data-follow="' + v.id + '">' + (liked ? '✓ 已关注' : '☆ 关注') + '</button>' +
      '</div></div>';
  }

  function renderVenues() {
    var list = DB.all('venues').filter(function (v) {
      if (state.region && v.region !== state.region) return false;
      if (state.kw) {
        var hay = (v.name + v.location + (v.pandas || []).join('') + JSON.stringify(v.dynamics || [])).toLowerCase();
        if (hay.indexOf(state.kw.toLowerCase()) < 0) return false;
      }
      return true;
    });
    $('#venueGrid').innerHTML = list.length
      ? list.map(venueCard).join('')
      : '<div class="empty" style="grid-column:1/-1"><div class="big">🔍</div>没有找到匹配的场馆，换个关键词试试</div>';
    $$('#venueGrid [data-follow]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var on = DB.toggleFollow(btn.dataset.follow);
        btn.classList.toggle('liked', on);
        btn.classList.toggle('btn-ghost', !on);
        btn.textContent = on ? '✓ 已关注' : '☆ 关注';
        U.toast(on ? '已关注该场馆，新动态会在这里提醒' : '已取消关注');
      });
    });
  }

  /* 动态流 */
  function renderDyn() {
    var items = [];
    DB.all('venues').forEach(function (v) {
      (v.dynamics || []).forEach(function (d) { items.push({ v: v, d: d }); });
    });
    items = items.filter(function (x) {
      if (state.region && x.v.region !== state.region) return false;
      if (state.kw) {
        var hay = (x.d.title + x.d.text + x.d.source + x.v.name + (x.d.tags || []).join('')).toLowerCase();
        if (hay.indexOf(state.kw.toLowerCase()) < 0) return false;
      }
      return true;
    });
    items.sort(function (a, b) { return a.d.date < b.d.date ? 1 : -1; });
    $('#dynCount').textContent = '共 ' + items.length + ' 条';
    $('#dynList').innerHTML = items.length ? items.map(function (x) {
      var tags = (x.d.tags || []).map(function (t) { return '<span class="tag gray">' + esc(t) + '</span>'; }).join('');
      return '<div class="card card-pad" style="margin-bottom:12px">' +
        '<div class="card-meta"><span class="tag green">' + esc(x.v.name) + '</span><span>' + x.d.date + '</span><span>来源：' + esc(x.d.source) + '</span>' + tags + '</div>' +
        '<div class="card-title" style="margin-top:8px"><a href="zoo-detail.html?id=' + x.v.id + '">' + esc(x.d.title) + '</a></div>' +
        '<div class="card-desc">' + esc(x.d.text) + '</div>' +
        '</div>';
    }).join('') : '<div class="empty"><div class="big">📭</div>暂无匹配的动态</div>';
  }

  $$('#regionTabs .filter-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      $$('#regionTabs .filter-tab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      state.region = tab.dataset.region;
      renderVenues(); renderDyn();
    });
  });
  $('#btnSearch').addEventListener('click', function () {
    state.kw = $('#kw').value.trim();
    renderVenues(); renderDyn();
  });
  $('#kw').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#btnSearch').click(); });
  $('#btnReset').addEventListener('click', function () {
    state.kw = ''; $('#kw').value = '';
    $$('#regionTabs .filter-tab').forEach(function (t) { t.classList.toggle('active', !t.dataset.region); });
    state.region = '';
    renderVenues(); renderDyn();
  });

  renderVenues();
  renderDyn();
})();
</script>
</body>
</html>
