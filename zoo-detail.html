<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>场馆专题 - 熊猫资讯</title>
<meta name="description" content="单场馆专题页：场馆信息、馆内熊猫名单、全部动态与官方入口。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐼</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="wrap">
  <div class="detail-hero" id="venueInfo"></div>

  <section class="section">
    <div class="section-head"><span class="line"></span><h2>馆内熊猫名单</h2></div>
    <div id="pandaList"></div>
  </section>

  <section class="section">
    <div class="section-head"><span class="line"></span><h2>场馆全部动态</h2></div>
    <div id="dynList"></div>
  </section>

  <section class="section">
    <div class="section-head"><span class="line"></span><h2>官方入口</h2></div>
    <div class="card card-pad" id="officialLink"></div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<div id="toast"></div>

<script src="js/seed-data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  var DB = PandaDB, U = PandaUI, esc = U.esc, $ = U.$;
  var vid = new URLSearchParams(location.search).get('id');
  var v = DB.find('venues', vid);
  if (!v) {
    $('main').innerHTML = '<div class="empty" style="padding:80px 0"><div class="big">🐼</div>未找到该场馆<br><a class="btn btn-primary btn-sm" style="margin-top:14px" href="zoo.html">返回场馆列表</a></div>';
    return;
  }

  var follows = DB.getFollows();
  var liked = follows.indexOf(v.id) >= 0;
  $('#venueInfo').innerHTML =
    '<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start">' +
    '<div style="width:130px;flex-shrink:0">' + U.pandaSVG(v.name, v.id, { w: 260 }) + '</div>' +
    '<div style="flex:1;min-width:240px">' +
    '<h1>' + esc(v.name) + '</h1>' +
    '<div class="detail-meta">' +
    '<span class="tag ' + (v.region === 'domestic' ? 'green' : 'blue') + '">' + (v.region === 'domestic' ? '国内场馆' : '海外场馆') + '</span>' +
    '<span>📍 ' + esc(v.location) + '</span>' +
    '<span>🐼 熊猫数量：' + esc(v.pandaCount || '') + '</span>' +
    '<span>🕒 更新：' + v.updatedAt + '</span>' +
    '</div>' +
    '<p style="font-size:14.5px;color:var(--ink-2);margin-top:10px">' + esc(v.intro) + '</p>' +
    '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn ' + (liked ? '' : 'btn-outline') + ' btn-sm follow-btn" id="followBtn">' + (liked ? '✓ 已关注' : '☆ 关注本场馆') + '</button>' +
    (v.officialUrl ? '<a class="btn btn-primary btn-sm" href="' + esc(v.officialUrl) + '" target="_blank" rel="noopener">官网入口 ↗</a>' : '') +
    '</div></div></div>';

  $('#followBtn').addEventListener('click', function () {
    var on = DB.toggleFollow(v.id);
    this.className = 'btn btn-sm follow-btn ' + (on ? '' : 'btn-outline');
    this.textContent = on ? '✓ 已关注' : '☆ 关注本场馆';
    U.toast(on ? '已关注 ' + v.name : '已取消关注');
  });

  /* 熊猫名单 */
  var pandaBox = $('#pandaList');
  var pandaRows = (v.pandas || []).map(function (name) {
    var pp = DB.all('pandas').filter(function (x) { return x.name === name; })[0];
    if (pp) {
      return '<div class="card card-pad" style="display:flex;gap:14px;align-items:center">' +
        '<div class="panda-avatar small">' + U.pandaSVG(pp.name, pp.id, { w: 96 }) + '</div>' +
        '<div style="flex:1"><a class="card-title" href="panda-detail.html?id=' + pp.id + '">' + esc(pp.name) + '</a>' +
        '<div class="card-desc">' + esc(pp.gender) + ' · ' + esc(pp.birthday) + ' · 谱系号 ' + esc(pp.studbook) + '<br>' + esc(U.chunk(pp.feature, 40)) + '</div></div>' +
        '<a class="btn btn-ghost btn-sm" href="panda-detail.html?id=' + pp.id + '">档案 →</a></div>';
    }
    return '<div class="card card-pad" style="display:flex;gap:14px;align-items:center"><div class="panda-avatar small">' + U.pandaSVG(name, 'x' + name, { w: 96 }) + '</div><div class="card-title">' + esc(name) + '</div></div>';
  }).join('');
  pandaBox.innerHTML = pandaRows || '<div class="empty"><div class="big">🌱</div>该场馆暂无大熊猫常驻</div>';

  /* 动态 */
  var dynBox = $('#dynList');
  var dyns = (v.dynamics || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  dynBox.innerHTML = dyns.length ? dyns.map(function (d) {
    var tags = (d.tags || []).map(function (t) { return '<span class="tag gray">' + esc(t) + '</span>'; }).join('');
    return '<div class="card card-pad" style="margin-bottom:12px">' +
      '<div class="card-meta"><span>' + d.date + '</span><span>来源：' + esc(d.source) + '</span>' + tags + '</div>' +
      '<div class="card-title" style="margin-top:8px">' + esc(d.title) + '</div>' +
      '<div class="card-desc">' + esc(d.text) + '</div></div>';
  }).join('') : '<div class="empty"><div class="big">📭</div>暂无动态，可关注本场馆等待更新</div>';

  /* 官方入口 */
  $('#officialLink').innerHTML = v.officialUrl
    ? '<p style="font-size:14px">官方信息请以 <a href="' + esc(v.officialUrl) + '" target="_blank" rel="noopener">' + esc(v.name) + ' 官方网站</a> 为准。本站仅做信息整理，不代官方发布任何内容。</p>'
    : '<p style="font-size:14px;color:var(--ink-2)">该场馆暂未收录官方入口，相关信息以当地官方发布为准。</p>';

  document.title = v.name + ' - 熊猫资讯';
})();
</script>
</body>
</html>
