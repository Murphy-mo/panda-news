<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科普文章 - 熊猫资讯</title>
<meta name="description" content="熊猫科普文章详情。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐼</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="wrap" style="max-width:820px">
  <div style="margin-top:24px"><a href="science.html" style="font-size:13.5px">← 返回科普专栏</a></div>
  <div id="article"></div>
</main>

<footer class="site-footer" id="site-footer"></footer>
<div id="toast"></div>

<script src="js/seed-data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  var DB = PandaDB, U = PandaUI, esc = U.esc, $ = U.$;
  var id = new URLSearchParams(location.search).get('id');
  var a = DB.find('articles', id);
  if (!a) {
    $('main').innerHTML = '<div class="empty" style="padding:80px 0"><div class="big">🐼</div>文章不存在<br><a class="btn btn-primary btn-sm" style="margin-top:14px" href="science.html">返回科普专栏</a></div>';
    return;
  }
  var diffCls = a.difficulty === '硬核科研' ? 'purple' : a.difficulty === '进阶干货' ? 'orange' : 'blue';
  var rel = [];
  if (a.relatedPanda) { var pp = DB.find('pandas', a.relatedPanda); if (pp) rel.push('<a class="tag green" href="panda-detail.html?id=' + pp.id + '">🐼 相关档案：' + esc(pp.name) + '</a>'); }
  if (a.relatedVenue) { var vv = DB.find('venues', a.relatedVenue); if (vv) rel.push('<a class="tag blue" href="zoo-detail.html?id=' + vv.id + '">🏛️ 相关场馆：' + esc(vv.name) + '</a>'); }

  $('#article').innerHTML =
    '<div class="detail-hero" style="margin-top:14px">' +
    '<div class="card-meta" style="margin-top:0"><span class="tag green">' + esc(a.category) + '</span><span class="tag ' + diffCls + '">' + esc(a.difficulty) + '</span></div>' +
    '<h1 style="margin-top:10px">' + esc(a.title) + '</h1>' +
    '<div class="detail-meta"><span>' + a.date + '</span><span>来源：' + esc(a.source) + '</span>' + rel.join('') + '</div>' +
    '</div>' +
    '<div class="card card-pad" style="margin-top:16px"><div class="article-body">' + a.content + '</div></div>' +
    '<div style="margin:22px 0;text-align:center"><a class="btn btn-outline" href="science.html">更多科普文章 →</a></div>';
  document.title = a.title + ' - 熊猫资讯';
})();
</script>
</body>
</html>
