<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熊猫圈大事件 - 熊猫资讯</title>
<meta name="description" content="熊猫圈大事件时间线：繁育、命名、回国租借、科研成果、公益活动、离世纪念，每条标注官方实锤或网传待证实。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐼</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<div class="page-hero">
  <div class="wrap">
    <h1>📅 熊猫圈大事件</h1>
    <p>按年份归档的熊猫圈大事时间线。每条事件标注【官方实锤】或【网传待证实】，重大事件附专题聚合。</p>
  </div>
</div>

<main class="wrap">
  <!-- 置顶快讯 -->
  <section class="section" id="pinnedSec">
    <div class="section-head"><span class="line"></span><h2>🔥 最新快讯</h2></div>
    <div id="pinnedList"></div>
  </section>

  <!-- 标签筛选 -->
  <div class="filter-tabs" id="tagTabs">
    <button class="filter-tab active" data-tag="">全部事件</button>
    <button class="filter-tab" data-tag="繁育">繁育</button>
    <button class="filter-tab" data-tag="命名">命名</button>
    <button class="filter-tab" data-tag="回国租借">回国租借</button>
    <button class="filter-tab" data-tag="科研成果">科研成果</button>
    <button class="filter-tab" data-tag="公益活动">公益活动</button>
    <button class="filter-tab" data-tag="离世纪念">离世纪念</button>
  </div>

  <!-- 时间线 -->
  <section class="section">
    <div id="timeline"></div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<div id="toast"></div>

<script src="js/seed-data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  var DB = PandaDB, U = PandaUI, esc = U.esc, $ = U.$, $$ = U.$$;
  var state = { tag: '' };

  function badge(e) {
    return e.status === 'official'
      ? '<span class="badge-status badge-official">官方实锤</span>'
      : '<span class="badge-status badge-rumor">网传待证实</span>';
  }

  function renderPinned() {
    var list = DB.all('events').filter(function (e) { return e.pinned; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    $('#pinnedSec').style.display = list.length ? '' : 'none';
    $('#pinnedList').innerHTML = list.map(function (e) {
      return '<div class="card card-pad" style="margin-bottom:10px">' +
        '<div class="card-meta"><span class="tag orange">📌 置顶</span><span>' + e.date + '</span>' + badge(e) + '<span class="tag gray">' + esc(e.tag) + '</span><span>来源：' + esc(e.source) + '</span></div>' +
        '<div class="card-title" style="margin-top:8px;font-size:16.5px">' + esc(e.title) + '</div>' +
        '<div class="card-desc">' + esc(U.chunk(e.content, 120)) + '</div>' +
        '<div style="margin-top:10px"><button class="btn btn-primary btn-sm" data-open="' + e.id + '">专题聚合：查看完整报道 →</button></div></div>';
    }).join('');
    bindOpen();
  }

  function renderTimeline() {
    var list = DB.all('events').filter(function (e) { return !state.tag || e.tag === state.tag; })
      .sort(function (a, b) { return (a.year - b.year) || (a.date < b.date ? 1 : -1); });
    var years = [];
    list.forEach(function (e) { if (years.indexOf(e.year) < 0) years.push(e.year); });
    years.sort(function (a, b) { return b - a; });

    $('#timeline').innerHTML = years.map(function (y) {
      var items = list.filter(function (e) { return e.year === y; })
        .sort(function (a, b) { return a.date < b.date ? 1 : -1; })
        .map(function (e) {
          return '<div class="tl-item ' + (e.status === 'rumor' ? 'rumor' : '') + '">' +
            '<div class="tl-date">' + e.date + '　' + badge(e) + '</div>' +
            '<div style="font-weight:700;font-size:15px;margin:3px 0">' + esc(e.title) +
            ' <span class="tag gray" style="font-weight:400">' + esc(e.tag) + '</span>' +
            '</div>' +
            '<div class="card-desc">' + esc(U.chunk(e.content, 90)) + '</div>' +
            '<div class="card-meta">来源：' + esc(e.source) + '　<button class="btn btn-ghost btn-sm" data-open="' + e.id + '">全文 →</button></div>' +
            '</div>';
        }).join('');
      return '<div class="tl-year-head">' + y + ' 年</div><div class="timeline">' + items + '</div>';
    }).join('') || '<div class="empty"><div class="big">📭</div>该分类下暂无事件记录</div>';
    bindOpen();
  }

  function bindOpen() {
    $$('[data-open]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var e = DB.find('events', btn.dataset.open);
        if (!e) return;
        U.openModal(
          '<span class="tag orange">📌 专题聚合</span> <span class="tag gray">' + esc(e.tag) + '</span> ' + badge(e) +
          '<h3 style="margin-top:12px">' + esc(e.title) + '</h3>' +
          '<div class="card-meta">' + e.date + ' · 来源：' + esc(e.source) + '</div>' +
          '<div class="article-body" style="margin-top:12px"><p>' + esc(e.content) + '</p></div>' +
          '<blockquote style="margin-top:12px;font-size:13px;color:var(--ink-3)">本页为信息聚合展示。如内容涉及官方公告，请点击来源链接核对原文。</blockquote>'
        );
      });
    });
  }

  $$('#tagTabs .filter-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      $$('#tagTabs .filter-tab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      state.tag = tab.dataset.tag;
      renderPinned(); renderTimeline();
    });
  });

  renderPinned();
  renderTimeline();
})();
</script>
</body>
</html>
